* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 28px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font: 600 26px/1.25 var(--serif); margin: 6px 0 12px; }

main { padding: 24px 0 64px; }

.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--low-soft); color: var(--low); vertical-align: 1px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }

th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; }

.md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }

.md code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
.md table { margin: 8px 0 12px; }

.empty { text-align: center; padding: 60px 16px; }
.dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 32px; margin: 20px auto; max-width: 560px; background: var(--surface); }
textarea { width: 100%; min-height: 140px; margin-top: 12px; font: 13px var(--mono); padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.btn { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
:root[data-theme="dark"] .btn { color: #0d1b21; }
.err { color: var(--high); margin-top: 10px; }
.foot { color: var(--faint); font-size: 12px; margin-top: 32px; }
.print-only-name { display: none; }
.theme { position: absolute; top: 16px; right: 16px; }
header.top { position: relative; }

.ladder span { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--faint); background: var(--surface-2); }

  details { display: block; } details > summary { display: none; }

  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}

    // ---- Key sentences ----
    if (panels.keys) {
      var kp = panels.keys, outline = D.key_sentences || [], flagged = {};
      add(kp, h("h2", { text: "Key-sentence outline" }), h("p", { class: "lede", text: "The first sentence of each body paragraph, in order. Read alone, it should tell the argument." }));
      if (K) {
        add(kp, h("div", { class: "card" }, h("h4", { text: "Does the outline tell the argument?" }), h("div", { text: K.verdict })));
        K.flags.forEach(function (f) { flagged[f.paragraph_id] = f.issue; });
      } else add(kp, h("p", { class: "muted small", text: "The key-sentence check didn't run for this draft; the outline is still here to read." }));
      var box = h("div", { class: "card outline" }), cur = null;
      outline.forEach(function (k) {
        if (k.section_id !== cur) { cur = k.section_id; box.appendChild(h("h4", { text: sections[cur] || cur || "", style: "margin-top:14px" })); }
        box.appendChild(h("div", { class: "ks" + (flagged[k.id] ? " flagged" : "") }, h("span", { class: "kid", text: k.id }), h("span", { class: "serif", text: k.text }),
          flagged[k.id] ? h("div", { class: "small", style: "color:var(--medium)", text: flagged[k.id] }) : null));
      });
      if (outline.length) add(kp, box);
    }

    // ---- Method ----
    var me = panels.method, run = R.run, rw = Q.related_work;
    add(me, h("h2", { text: "How this review was run" }), h("div", { class: "card small" },
      h("div", null, h("b", { text: "Draft: " }), (D.source_file || "your draft") + " (" + D.word_count + " words; working copy ", h("code", { text: D.working_copy }), "). This report refers to the draft by filename and doesn't include its text."),
      h("div", null, "Run ", h("code", { text: run.id }), " · " + run.created_at + " · " + run.platform + " · model " + run.model + ". Each reader reviewed the draft in turn, in one conversation."),
      h("div", null, "Quotes checked: " + Q.anchoring.verified + " of " + Q.anchoring.total + " quote the draft word for word."),
      rw.specific ? h("div", { text: "Named works: " + rw.specific + " named; " + rw.verified + " verified, " + rw.cited_in_draft + " already cited, " + rw.not_checked + " not checked, " + rw.not_found + " not found and left out." }) : null,
      h("div", { class: "muted", text: "Skill content " + run.content_hash + (run.tool_version ? " · version " + run.tool_version : "") })));
    if ((R.assumptions || []).length) add(me, h("h2", { text: "Assumptions" }), h("div", { class: "card" }, R.assumptions.map(function (a) {
      return h("p", { style: "margin:6px 0" }, tag(a.confirmed ? "Confirmed" : "Inferred", a.confirmed ? "clear" : "inferred"), " ", a.text, h("span", { class: "muted small", text: " — " + a.basis }));
    })));
    add(me, h("h2", { text: "Readers, as adapted for this draft" }));
    (R.personas || []).forEach(function (p) {
      add(me, h("div", { class: "card" }, h("details", { style: "margin:0" }, h("summary", { text: p.name + " (" + KIND[p.reader_type] + ", " + p.briefing + ")" }),
        p.adaptations.length ? h("div", { class: "small", style: "margin:8px 0" }, p.adaptations.map(function (a) { return h("div", null, h("b", { text: a.parameter + ": " }), a.value, h("span", { class: "muted", text: " — " + a.reason })); })) : null,
        markdown(p.adapted_text))));
    });
    if (S && S.output.dropped_findings.length) add(me, h("h2", { text: "Findings set aside" }), h("div", { class: "card small" }, S.output.dropped_findings.map(function (d) {
      return h("div", { style: "margin:4px 0" }, h("code", { text: d.finding_ref }), " ", tag(d.rule.replace(/_/g, " ")), " ", d.note); })));
    var lost = works.filter(function (w) { return w.status === "not_found"; });
    if (lost.length) add(me, h("h2", { text: "Named works that couldn't be found" }), h("div", { class: "card small" }, lost.map(function (w) {
      return h("div", { style: "margin:4px 0" }, h("code", { text: w.ref }), " ", w.work, w.note ? h("span", { class: "muted", text: " — " + w.note }) : null); })));
    var dl = h("button", { class: "toggle no-print", type: "button", text: "Download results.json" });
    dl.addEventListener("click", function () {
      var a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(R, null, 2)], { type: "application/json" })), download: "results.json" });
      document.body.appendChild(a); a.click(); a.remove();
    });
    add(me, dl,
      h("p", { class: "foot" }, "Generated by ", h("a", { href: "https://github.com/nickhafen/nh-ai-skills", target: "_blank", rel: "noopener noreferrer", text: "scholarly-draft-review" }), ". This file works offline; nothing in it is sent anywhere."));

    show((location.hash || "#overview").slice(1));
  }

  // ---------- viewer mode (no embedded results) ----------
  function viewer(message) {
    var app = document.getElementById("app"); app.innerHTML = "";
    var err = h("div", { class: "err", text: message || "" });
    var input = h("input", { type: "file", accept: ".json,application/json" });
    var ta = h("textarea", { placeholder: "…or paste the contents of results.json here" });
    function load(text) {
      try { var R = JSON.parse(text); if (!R || !R.document || !R.analysis || !R.analysis.stage) throw new Error("This doesn't look like a scholarly-draft-review results file."); render(R); }
      catch (e) { err.textContent = "Couldn't read that file: " + e.message; }
    }
    input.addEventListener("change", function () { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { load(r.result); }; r.readAsText(f); });
    var btn = h("button", { class: "btn", type: "button", text: "Show report" }); btn.addEventListener("click", function () { load(ta.value); });
    add(app, h("div", { class: "wrap empty" }, h("div", { class: "eyebrow", text: "Scholarly draft review" }), h("h1", { text: "Open a review" }),
      h("p", { class: "muted", text: "Open or paste a results.json file. It's read in your browser and never uploaded." }),
      h("div", { class: "dropzone" }, input, ta, btn, err)));
  }

  var raw = document.getElementById("results-data").textContent;
  var data = null;
  try { data = JSON.parse(raw.replace(/^\s*\/\*RESULTS_JSON\*\/\s*/, "")); } catch (e) { data = null; }
  if (data) { try { render(data); } catch (e) { viewer("This report couldn't be displayed: " + e.message); } }
  else viewer();
})();
