<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarly draft review</title>
<style>
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface-2: #f1efea; --border: #e2ded6;
  --text: #1f2328; --muted: #5d6470; --faint: #8a909a;
  --accent: #1f5f7a; --accent-soft: #e3eff4; --accent-text: #174a5f;
  --high: #b3261e; --high-soft: #fbe9e7; --medium: #9a6700; --medium-soft: #fff4d6;
  --low: #57606a; --low-soft: #eef0f2; --good: #1a7f37; --good-soft: #e3f4e8;
  --quote-bar: #c9b88f; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --surface-2: #24282d; --border: #33383f;
    --text: #e6e8eb; --muted: #a3a9b2; --faint: #7d848d;
    --accent: #6cb4d1; --accent-soft: #1d3440; --accent-text: #9fd0e4;
    --high: #ff8a80; --high-soft: #3a1f1d; --medium: #e8b45a; --medium-soft: #372d17;
    --low: #a3a9b2; --low-soft: #2a2e33; --good: #6fd08c; --good-soft: #1b3324;
    --quote-bar: #8a7a55; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --surface-2: #24282d; --border: #33383f;
  --text: #e6e8eb; --muted: #a3a9b2; --faint: #7d848d;
  --accent: #6cb4d1; --accent-soft: #1d3440; --accent-text: #9fd0e4;
  --high: #ff8a80; --high-soft: #3a1f1d; --medium: #e8b45a; --medium-soft: #372d17;
  --low: #a3a9b2; --low-soft: #2a2e33; --good: #6fd08c; --good-soft: #1b3324;
  --quote-bar: #8a7a55; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

header.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 28px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font: 600 26px/1.25 var(--serif); margin: 6px 0 12px; }
.front-matter { margin: 0; border-top: 1px solid var(--border); }
.front-matter > summary { cursor: pointer; padding: 12px 0; color: var(--accent-text); font-size: 14px; list-style: none; }
.front-matter > summary::-webkit-details-marker { display: none; }
.front-matter > summary::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
.front-matter[open] > summary::before { transform: rotate(90deg); }
.front-matter .limits-card { margin: 0 0 18px; }

nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 12px 14px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--text); }
nav.tabs .count { font-size: 12px; color: var(--faint); margin-left: 4px; }

main { padding: 24px 0 64px; }
section.panel { display: none; }
section.panel.active { display: block; }
h2 { font: 600 19px/1.3 var(--serif); margin: 28px 0 12px; }
h2:first-child { margin-top: 0; }
h3 { font-size: 16px; margin: 0 0 6px; line-height: 1.35; }
.lede { color: var(--muted); margin: -4px 0 16px; max-width: 75ch; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin: 0 0 12px; box-shadow: var(--shadow); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.grid .card { margin: 0; }
.card h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--low-soft); color: var(--low); vertical-align: 1px; }
.tag.high, .tag.missing, .tag.no { background: var(--high-soft); color: var(--high); }
.tag.medium, .tag.unclear_or_buried, .tag.partly, .tag.skimmed { background: var(--medium-soft); color: var(--medium); }
.tag.clear, .tag.yes, .tag.read_closely { background: var(--good-soft); color: var(--good); }
.tag.inferred { background: var(--medium-soft); color: var(--medium); }
.tag.accent { background: var(--accent-soft); color: var(--accent-text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); }

blockquote.q { margin: 10px 0; padding: 6px 0 6px 14px; border-left: 3px solid var(--quote-bar); font: 15px/1.55 var(--serif); color: var(--text); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.direction { margin-top: 8px; font-size: 14px; }
.direction b { color: var(--accent-text); }

.issue { display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; }
.rank { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
.overview-row { display: flex; gap: 10px; margin: 10px 0; }
.issue-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 4px; }
details { margin-top: 8px; }
details > summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.support { border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 8px; }
.support .who { font-weight: 600; font-size: 13px; }

.toggle { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; font-weight: 600; }

.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.subtabs button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; }
.subtabs button[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 600; }
.table-wrap { overflow-x: auto; }



.md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md h1, .md h2, .md h3, .md h4 { font: 600 15px/1.3 var(--sans); margin: 14px 0 6px; }
.md code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
.md table { margin: 8px 0 12px; }

.empty { text-align: center; padding: 60px 16px; }
.dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 32px; margin: 20px auto; max-width: 560px; background: var(--surface); }
textarea { width: 100%; min-height: 140px; margin-top: 12px; font: 13px var(--mono); padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.btn { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
:root[data-theme="dark"] .btn { color: #0d1b21; }
.err { color: var(--high); margin-top: 10px; }
.foot { color: var(--faint); font-size: 12px; margin-top: 32px; }
.print-only-name { display: none; }
.theme { position: absolute; top: 16px; right: 16px; }
header.top { position: relative; }

.ladder { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
.ladder span { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--faint); background: var(--surface-2); }
.ladder span.done { color: var(--muted); }
.ladder span.here { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.serif { font-family: var(--serif); }
.limits-card { border-left: 4px solid var(--medium); }
.limits { margin: 0; padding-left: 18px; font-size: 14px; }
.limits li { margin: 4px 0; }
.outline h4:first-child { margin-top: 0 !important; }
.ks { display: grid; grid-template-columns: 42px 1fr; gap: 2px 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.ks:last-child { border-bottom: 0; }
.ks .kid { font: 12px var(--mono); color: var(--faint); padding-top: 3px; }
.ks > div { grid-column: 2; }
.ks.flagged { background: var(--medium-soft); border-radius: 6px; padding: 4px 6px; }

@media (max-width: 600px) {
  h1 { font-size: 22px; }
  .issue { grid-template-columns: 1fr; }
  .rank { margin-bottom: 6px; }
  .card { padding: 14px; }
}
@media print {
  nav.tabs, .theme, .subtabs, .no-print { display: none !important; }
  section.panel, .persona-panel, .print-only-name { display: block !important; }
  section.panel { break-before: page; }
  section.panel:first-of-type { break-before: auto; }
  details { display: block; } details > summary { display: none; }
  details > *:not(summary) { display: block !important; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="results-data">/*RESULTS_JSON*/null</script>
<script>
(function () {
  "use strict";

  // ---------- small DOM helpers ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el) {
    for (var i = 1; i < arguments.length; i++) {
      var child = arguments[i];
      if (child == null || child === false) continue;
      if (Array.isArray(child)) { child.forEach(function (c) { add(el, c); }); continue; }
      el.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tag(text, cls) { return h("span", { class: "tag " + (cls || ""), text: text }); }
  function quote(text) { return text ? h("blockquote", { class: "q", text: "“" + String(text).replace(/\s+/g, " ").trim() + "”" }) : null; }

  // Minimal, safe markdown: everything is escaped first, then a few patterns are formatted.
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }
  function markdown(text) {
    var lines = String(text || "").replace(/\r\n/g, "\n").split("\n"), out = [], i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      var m;
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { out.push("<h4>" + inline(m[2]) + "</h4>"); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(line)) {
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = rows.filter(function (r) { return !/^\s*\|[\s:|-]+\|\s*$/.test(r); }).map(function (r) {
          return r.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return inline(c.trim()); });
        });
        var t = "<div class=\"table-wrap\"><table>" + cells.map(function (r, n) {
          return "<tr>" + r.map(function (c) { return n === 0 ? "<th>" + c + "</th>" : "<td>" + c + "</td>"; }).join("") + "</tr>";
        }).join("") + "</table></div>";
        out.push(t); continue;
      }
      if (/^\s*>/.test(line)) {
        var qs = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { qs.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push("<blockquote>" + inline(qs.join(" ")) + "</blockquote>"); continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line), items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""); i++;
          while (i < lines.length && lines[i].trim() && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) { item += " " + lines[i].trim(); i++; }
          items.push("<li>" + inline(item) + "</li>");
        }
        out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\|)/.test(lines[i])) { para.push(lines[i].trim()); i++; }
      if (!para.length) { para.push(line.trim()); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return h("div", { class: "md", html: out.join("") });
  }

  // ---------- labels ----------
  var SEV = { high: "High", medium: "Medium", low: "Low" };
  var STATUS = { clear: "Clear", unclear_or_buried: "Unclear or buried", missing: "Missing", not_applicable: "n/a" };
  var STAGE = { idea: "Idea", early: "Early draft", full: "Full draft", workshop: "Workshop draft", submission: "Submission draft" };
  var STAGES = ["idea", "early", "full", "workshop", "submission"];
  var KIND = { nonexpert: "Nonexpert", expert: "Law-trained, outside the specialty", Expert: "Specialist", gatekeeper: "Gatekeeper", custom: "Custom reader" };
  var WORK = { verified: "Verified", cited_in_draft: "Already cited", not_checked: "Not checked: confirm it exists before relying on it", kind: "Kind of work to search for" };

  // ---------- render ----------
  function render(R) {
    var app = document.getElementById("app"); app.innerHTML = "";
    var A = R.analysis, S = R.synthesis, Q = R.quality, K = R.key_sentence_check, D = R.document;
    var names = { "key-sentences": "Key-sentence outline" };
    (R.personas || []).forEach(function (p) { names[p.id] = p.name; });
    var nm = function (id) { return names[id] || id; };
    var issues = S ? S.output.issues : [];
    var ranked = {}; if (S) S.ranked_issues.forEach(function (r) { ranked[r.issue_index] = r; });
    var findings = {}; (R.persona_reviews || []).forEach(function (rv) { rv.output.findings.forEach(function (f, i) { findings[rv.persona_id + "/" + (i + 1)] = { pid: rv.persona_id, f: f }; }); });
    if (K) K.flags.forEach(function (f, i) { findings["key-sentences/" + (i + 1)] = { pid: "key-sentences", f: { issue: f.issue, why_it_matters: "", quote: f.quote } }; });
    var checks = {}; ((R.related_work_check || {}).items || []).forEach(function (i) { checks[i.ref] = i; });
    var works = [];
    (R.persona_reviews || []).forEach(function (rv) { (rv.output.related_work || []).forEach(function (w, n) {
      var ref = rv.persona_id + "/rw" + (n + 1), c = w.specific ? (checks[ref] || { status: "not_checked" }) : null;
      works.push({ ref: ref, reader: rv.persona_id, work: w.work, why: w.why, confidence: w.confidence,
        status: w.specific ? c.status : "kind", url: c && /^https?:\/\//i.test(c.url || "") ? c.url : null, note: c ? c.note : "" });
    }); });
    function workItem(w, showReader) {
      return h("div", { style: "margin:8px 0" },
        w.url ? h("a", { href: w.url, target: "_blank", rel: "noopener noreferrer", text: w.work }) : h("b", { text: w.work }), " ",
        tag(WORK[w.status], w.status === "verified" || w.status === "cited_in_draft" ? "clear" : w.status === "not_checked" ? "medium" : ""),
        h("div", { class: "small muted", text: w.why + " (" + w.confidence + " confidence" + (showReader ? "; " + nm(w.reader) : "") + ")" }));
    }
    function limitList(items) {
      return h("ul", { class: "limits" }, items.map(function (x) { return h("li", null, h("b", { text: x.title + ". " }), x.text); }));
    }
    function readersOf(issue) {
      var set = {}; (issue.reasons || []).forEach(function (r) { set[r.reader] = 1; });
      issue.finding_refs.forEach(function (ref) { set[ref.split("/")[0]] = 1; });
      if (issue.category === "key_sentence") set["key-sentences"] = 1;
      return Object.keys(set);
    }
    document.title = "Draft review: " + (D.title || A.piece_type);

    // Header
    var themeBtn = h("button", { class: "toggle theme no-print", type: "button", text: "Theme" });
    themeBtn.addEventListener("click", function () {
      var root = document.documentElement, cur = root.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", dark ? "light" : "dark");
    });
    var front = h("details", { class: "front-matter", open: true },
      h("summary", { text: "Before you rely on this" }),
      h("div", { class: "card limits-card" }, limitList(Q.limitations)));
    add(app, h("header", { class: "top" }, h("div", { class: "wrap" },
      themeBtn,
      h("div", { class: "eyebrow", text: "Scholarly draft review" }),
      h("h1", { text: D.title || A.piece_type }),
      front
    )));

    // Tabs
    var tabs = [
      ["overview", "Overview"], ["priorities", "Priorities", S ? S.priority_actions.length : null],
      ["readers", "Readers", R.persona_reviews.length], ["keys", "Key sentences"], ["method", "Method"]
    ].filter(function (t) {
      if (t[0] === "keys") return K || (D.key_sentences || []).length;
      return true;
    });
    var nav = h("nav", { class: "tabs", role: "tablist" }), navWrap = h("div", { class: "wrap" }); nav.appendChild(navWrap);
    var main = h("main", null), mainWrap = h("div", { class: "wrap" }); main.appendChild(mainWrap);
    var panels = {};
    tabs.forEach(function (t) {
      var b = h("button", { role: "tab", type: "button", "aria-selected": "false", "data-tab": t[0] }, t[1], t[2] != null ? h("span", { class: "count", text: String(t[2]) }) : null);
      b.addEventListener("click", function () { show(t[0]); });
      navWrap.appendChild(b);
      panels[t[0]] = h("section", { class: "panel", id: "panel-" + t[0] });
      mainWrap.appendChild(panels[t[0]]);
    });
    add(app, [nav, main]);
    function show(id) {
      if (!panels[id]) id = "overview";
      Object.keys(panels).forEach(function (k) { panels[k].classList.toggle("active", k === id); });
      navWrap.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === id ? "true" : "false"); });
      try { history.replaceState(null, "", "#" + id); } catch (e) {}
      window.scrollTo(0, Math.min(window.scrollY, nav.offsetTop));
    }

    // Issue card (shared)
    function issueCard(index, n) {
      var it = issues[index], readers = readersOf(it);
      var meta = h("div", { class: "issue-meta" }, tag(SEV[it.severity], it.severity),
        readers.map(function (x) { return h("span", { class: "chip", text: nm(x) }); }));
      var support = it.finding_refs.filter(function (ref) { return findings[ref]; });
      return h("div", { class: "card issue", "data-sev": it.severity, "data-readers": readers.join(" ") },
        h("div", { class: "rank", text: n != null ? String(n) : "•" }),
        h("div", null, h("h3", { text: it.title }), meta, quote(it.quote), h("div", { text: it.summary }),
          it.direction ? h("div", { class: "direction" }, h("b", { text: "Direction: " }), it.direction) : null,
          (support.length || (it.reasons || []).length) ? h("details", null, h("summary", { text: "What each reader said" }),
            support.length ? support.map(function (ref) { var s = findings[ref]; return h("div", { class: "support" }, h("div", { class: "who", text: nm(s.pid) }), h("div", { class: "small", text: s.f.issue + " " + s.f.why_it_matters })); }) :
              (it.reasons || []).map(function (x) { return h("div", { class: "support" }, h("div", { class: "who", text: nm(x.reader) }), h("div", { class: "small", text: x.reason })); })
          ) : null));
    }

    // ---- Overview ----
    var ov = panels.overview;
    if (S) {
      var top = h("div", { class: "card" });
